{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-chatbot-framework.fullname" . }}-backend
  labels:
    {{- include "ai-chatbot-framework.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-chatbot-framework.selectorLabels" . | nindent 4 }}
    component: backend
{{- end }}

---
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-chatbot-framework.fullname" . }}-frontend
  labels:
    {{- include "ai-chatbot-framework.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-chatbot-framework.selectorLabels" . | nindent 4 }}
    component: frontend
{{- end }}
