{{- if or .Values.mongodb.enabled .Values.documentdb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-chatbot-framework.mongodbSecretName" . }}
  labels:
    {{- include "ai-chatbot-framework.labels" . | nindent 4 }}
type: Opaque
data:
  connection-string: {{ include "ai-chatbot-framework.mongodbConnectionString" . | b64enc | quote }}
  {{- if .Values.mongodb.enabled }}
  username: {{ .Values.mongodb.auth.username | b64enc | quote }}
  password: {{ .Values.mongodb.auth.password | default (randAlphaNum 16) | b64enc | quote }}
  {{- else if .Values.documentdb.enabled }}
  {{- if .Values.secrets.documentdb.name }}
  # Using external secret, these will be populated from the referenced secret
  {{- else }}
  username: {{ .Values.documentdb.username | b64enc | quote }}
  password: {{ .Values.documentdb.password | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}

