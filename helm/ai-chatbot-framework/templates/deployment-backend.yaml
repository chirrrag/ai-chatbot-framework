{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-chatbot-framework.fullname" . }}-backend
  labels:
    {{- include "ai-chatbot-framework.labels" . | nindent 4 }}
    component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount.backend }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-chatbot-framework.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "ai-chatbot-framework.selectorLabels" . | nindent 8 }}
        component: backend
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-chatbot-framework.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.backend.enabled }}
      initContainers:
        - name: {{ .Chart.Name }}-migrate
          image: "{{ .Values.image.registry }}{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ .Values.initContainers.backend.command }}
          env:
            - name: MONGODB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-chatbot-framework.mongodbSecretName" . }}
                  key: connection-string
            - name: APPLICATION_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: APPLICATION_ENV
          resources:
            {{- toYaml .Values.initContainers.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.backend.command }}
          command: {{- toYaml .Values.backend.command | nindent 12 }}
          {{- else }}
          command: ["fastapi", "run", "--host", "0.0.0.0", "--port", "80", "--root-path", "/api"]
          {{- end }}
          {{- if .Values.backend.args }}
          args: {{- toYaml .Values.backend.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: MONGODB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-chatbot-framework.mongodbSecretName" . }}
                  key: connection-string
            - name: MONGODB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: MONGODB_DATABASE
            - name: APPLICATION_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: APPLICATION_ENV
            - name: MODELS_DIR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: MODELS_DIR
            - name: DEFAULT_FALLBACK_INTENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: DEFAULT_FALLBACK_INTENT_NAME
            - name: DEFAULT_WELCOME_INTENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: DEFAULT_WELCOME_INTENT_NAME
            - name: SPACY_LANG_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: SPACY_LANG_MODEL
            {{- if .Values.config.llm.enabled }}
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: LLM_BASE_URL
            - name: LLM_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: LLM_API_KEY
            - name: LLM_MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: LLM_MODEL_NAME
            - name: LLM_MAX_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: LLM_MAX_TOKENS
            - name: LLM_TEMPERATURE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-chatbot-framework.fullname" . }}-config
                  key: LLM_TEMPERATURE
            {{- end }}
            {{- with .Values.backend.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.backend.envFrom }}
          envFrom:
            {{- toYaml .Values.backend.envFrom | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          {{- if .Values.backend.startupProbe }}
          startupProbe:
            {{- toYaml .Values.backend.startupProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: model-files
              mountPath: {{ .Values.config.modelsDir }}
              {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/data
              {{- end }}
      volumes:
        - name: model-files
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ai-chatbot-framework.fullname" . }}-data
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
